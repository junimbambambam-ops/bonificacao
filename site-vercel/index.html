<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-pal="exec">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corporação Tiger Gate Ltd. – Programa de Bonificação</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--pri:#0b2545;--acc:#c9a227}
[data-pal=esm]{--pri:#0d3b2e;--acc:#c2a35d}[data-pal=graf]{--pri:#22272e;--acc:#f07f1a}[data-pal=vinho]{--pri:#5b1a2e;--acc:#d09a7a}
[data-theme=light]{--bg:#f3f5f8;--c:#fff;--c2:#eaeef3;--ink:#182230;--mut:#66758a;--line:#dde3ea;--ok:#157f4a;--okbg:#dbf3e5;--no:#b4322d;--nobg:#fadedc}
[data-theme=dark]{--bg:#0e1218;--c:#161c25;--c2:#1f2733;--ink:#e8edf4;--mut:#93a1b5;--line:#2a3443;--ok:#5fd394;--okbg:#153a28;--no:#f28b85;--nobg:#432120}
body{font:400 14px/1.6 'Poppins',sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
b,h1,h2,h3,th{font-weight:700}
small{color:var(--mut);font-size:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{background:var(--pri);color:#fff;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:0 24px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:16px}.brand small{display:block;color:#ffffffb3;line-height:1.2}
.mk{width:38px;height:38px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-size:20px}
.nav{display:flex;flex:1;flex-wrap:wrap}
.nav button{background:none;border:0;border-bottom:3px solid transparent;color:#ffffffb3;padding:20px 14px 17px;cursor:pointer}
.nav button.on{color:#fff;border-color:var(--acc);font-weight:700}
.tb{background:#ffffff1f;border:1px solid #ffffff40;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.tb.pri{background:var(--acc);border-color:var(--acc);color:#1b1300;font-weight:700}
select option{color:#182230}
#ind{color:#9be7bd;font-size:12px}
main{max-width:1120px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:28px;line-height:1.25}
.sub{color:var(--mut);margin:4px 0 20px}
.card{background:var(--c);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px #0000000d}
.hero{background:var(--pri);color:#fff;border-radius:18px;padding:30px 34px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:16px}
.hero .lab{color:#ffffffb3}.hero h1{margin:2px 0 16px}.hero .sub{color:#ffffffb3;margin:14px 0 0}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pills button{border:1px solid #ffffff55;background:none;color:#fff;border-radius:20px;padding:5px 16px;cursor:pointer}
.pills button.on{background:var(--acc);border-color:var(--acc);color:#1b1300;font-weight:700}
.pills .mv{padding:5px 12px}
.spot{background:#ffffff14;border:1px solid var(--acc);border-radius:16px;padding:20px 30px;min-width:250px;text-align:center}
.spot small{display:block;color:#ffffffcc}.spot b{display:block;font-size:32px;line-height:1.2;color:var(--acc)}
.meta{margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center}
.bar{height:10px;background:var(--c2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
.cat{display:flex;gap:14px;align-items:center;border-left:5px solid var(--acc)}
.cat .ic{font-size:34px}.cat b{display:block;font-size:17px;line-height:1.3}.cat span{color:var(--mut);font-size:13px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;margin:22px 0 18px}
.pd{text-align:center;cursor:pointer}.pd .med{font-size:40px;line-height:1.2}.pd h3{font-size:20px}
.pd .pts{font-size:40px;font-weight:700;line-height:1.1}
.pod .r0{order:2;padding-bottom:36px}.pod .r1{order:1}.pod .r2{order:3}
.pd.lead1{border:3px solid var(--acc);box-shadow:0 14px 34px #0000002e}.pd.lead1 h3{font-size:28px}.pd.lead1 .pts{font-size:56px;color:var(--acc)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--c);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--c2);font-size:12px}
tr[data-act]{cursor:pointer}tr[data-act]:hover td{background:var(--c2)}
tr.first td{background:color-mix(in srgb,var(--acc) 16%,var(--c))}
.bd{display:inline-block;padding:2px 12px;border-radius:20px;font-size:12px}.bd.ok{background:var(--okbg);color:var(--ok)}.bd.no{background:var(--nobg);color:var(--no)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end;margin-bottom:16px}
.step{text-align:center}.step .ic{font-size:40px;line-height:1.2}.step h3{font-size:16px;margin:6px 0 10px}
.step .ld{border-top:1px dashed var(--line);padding-top:8px;font-size:13px}.step .ld span{display:block;color:var(--mut)}
.step.big{background:var(--pri);color:#fff;border:3px solid var(--acc)}.step.big small,.step.big .ld span{color:#ffffffb3}.step.big .ld{border-color:#fff5}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:16px}
.gate{background:color-mix(in srgb,var(--acc) 16%,var(--c));border:1px solid var(--acc);border-radius:12px;padding:12px 18px;margin-bottom:16px}
.lane{margin-bottom:8px}.ln{display:flex;justify-content:space-between}.ln span{color:var(--mut)}
.trk{position:relative;height:14px;background:var(--c2);border-radius:9px;margin:30px 40px 30px 0}
.trk i{display:block;height:100%;background:var(--acc);border-radius:9px}
.trk em{position:absolute;top:-30px;transform:translateX(-50%);font-style:normal;font-size:22px}
.trk u{position:absolute;top:16px;transform:translateX(-50%);text-decoration:none;font-size:16px}
.trk s{position:absolute;right:-40px;top:-14px;text-decoration:none;font-size:32px}
.doc{max-width:820px}.doc h3{margin:22px 0 6px;color:var(--pri)}.doc h3:first-child{margin-top:0}
[data-theme=dark] .doc h3{color:var(--acc)}
.doc ol{list-style:none;padding:0}.doc li{margin:6px 0;padding-left:40px;text-indent:-40px}.doc li b{display:inline-block;width:40px;text-indent:0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--mut)}
td input,td select,.f input,.f select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--c);border-radius:8px;padding:7px 14px;cursor:pointer}.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.md{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.md>div{width:100%;max-width:460px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:30px}
body.edit [data-t]{outline:1px dashed var(--acc);outline-offset:3px;cursor:text}
.pres .adm{display:none!important}.pres tr[data-act],.pres .pd{cursor:default}
@media(max-width:800px){.hero{grid-template-columns:1fr}.pod,.ladder{grid-template-columns:1fr}.pod .pd{order:0!important;padding-bottom:20px!important}.pod .r0{order:-1!important}.top{padding:8px 14px}}

.ni0{--nc:#2563eb}.ni1{--nc:#9333ea}.ni2{--nc:#ea580c}
.tools{background:var(--c);border-bottom:1px solid var(--line);padding:8px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools #ind{color:var(--ok)}
.top{gap:16px}.nav button{padding:22px 14px 19px}
main{padding:28px 24px 44px}
.card{min-width:0}
.hero{margin-bottom:20px}.meta{margin-bottom:20px}
.cats{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-bottom:20px}
.cat{display:block;border-left:1px solid var(--line);border-top:5px solid var(--nc,var(--acc));padding:18px 20px}
.cat .hd{display:flex;align-items:center;gap:12px}
.cat .hd b{font-size:16px;line-height:1.3}
.cat .ic{font-size:24px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--nc,var(--acc)) 16%,var(--c))}
.cat .n{font-size:40px;font-weight:700;line-height:1.1;margin:10px 0 0}
.cat .ppl{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.cat .ppl div{display:flex;justify-content:space-between;gap:10px}.cat .ppl b{display:inline;font-size:13px;text-align:right}
.cat.tot{background:var(--pri);color:#fff;border-color:var(--pri);border-top-color:var(--acc)}
.cat.tot small,.cat.tot .ppl{color:#ffffffbf}.cat.tot .ic{background:#ffffff26}.cat.tot .ppl{border-color:#ffffff40}
.nb{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;padding:3px 12px;border-radius:20px;font-size:12px;background:color-mix(in srgb,var(--nc) 15%,var(--c));border:1px solid color-mix(in srgb,var(--nc) 45%,var(--c))}
td.n,th.n{text-align:center;width:1%;white-space:nowrap}
th[class*=ni]{border-bottom:3px solid var(--nc)}
tr.nr td:first-child{border-left:5px solid var(--nc)}
.tfo td{background:var(--pri);color:#fff;font-weight:700;border:0}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.flt button{border:1px solid var(--line);background:var(--c);border-radius:20px;padding:5px 16px;cursor:pointer}
.flt button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.ladder{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:stretch;gap:16px;margin-bottom:20px}
.step{padding-top:20px!important}
.lvl{height:6px;background:var(--c2);border-radius:6px;margin:0 0 12px;overflow:hidden}.lvl i{display:block;height:100%;background:var(--acc)}
.step.big .lvl{background:#ffffff33}
.two{gap:16px;margin-bottom:20px}.gate{margin-bottom:20px}
.pod{gap:16px}
@media(max-width:800px){main{padding:18px 14px 36px}.tools{padding:8px 14px}}

.svs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.svs span{font-size:12px;background:var(--c2);border-radius:20px;padding:2px 10px}
.sv{border:1px solid var(--line);background:var(--c);border-radius:20px;padding:2px 10px;font-size:12px;cursor:pointer;margin:2px;white-space:nowrap}
.sv.on{background:var(--nc,#9333ea);color:#fff;border-color:var(--nc,#9333ea)}
.metaC{margin-bottom:20px}
.mrow{display:grid;grid-template-columns:190px 1fr 190px;gap:12px;align-items:center;margin-top:10px}
.mrow .bar i{background:var(--nc,var(--acc))}.mrow.tt{border-top:1px dashed var(--line);padding-top:10px}.mrow.tt .bar i{background:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--c)}.mc.on{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--c))}.mc b{display:block;font-size:13px}
.chs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chs button{border:2px solid var(--line);background:var(--c);border-radius:12px;padding:8px 14px;cursor:pointer}
.chs button.on{border-color:var(--nc);background:color-mix(in srgb,var(--nc) 14%,var(--c));font-weight:700}
.nw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.nw .btn{background:var(--nc);border-color:var(--nc);color:#fff}
.f2{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:8px}
@media(max-width:800px){.mrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="mk">🐯</span><div><b>Corporação Tiger Gate Ltd.</b><small>Programa de Bonificação</small></div></div>
  <div class="nav" id="nav"></div>
  <button class="tb" data-act="theme" aria-label="Tema claro ou escuro">🌓</button>
</div>
<div class="tools adm">
  <select id="pal" class="btn" aria-label="Paleta de cores"><option value="exec">🎨 Executivo</option><option value="esm">🎨 Esmeralda</option><option value="graf">🎨 Grafite</option><option value="vinho">🎨 Vinho</option></select>
  <button class="btn" data-act="edit" id="be">✏️ Modo edição</button>
  <button class="btn pri" data-act="save">💾 Salvar</button>
  <span id="ind"></span>
  <span style="flex:1"></span>
  <button class="btn" data-act="dl" data-pres="0">📥 Backup editável</button>
  <button class="btn pri" data-act="dl" data-pres="1">🎤 Baixar apresentação</button>
</div>
<main id="app"></main>
<div id="modal"></div>
<script id="seed" type="application/json">null</script>
<script>
const $=s=>document.querySelector(s),EMP='Corporação Tiger Gate Ltd.',TIPOS=['Seguro','Marketing','Aluguel de Motos'],TI={Seguro:'🛡️',Marketing:'📣','Aluguel de Motos':'🏍️'},MED=['🥇','🥈','🥉'];
const PER=[['m','Mensal'],['3','3 meses'],['6','6 meses'],['9','9 meses'],['12','12 meses']],PI={m:'🎁',3:'🥉',6:'🥈',9:'🥇',12:'🏆'};
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),ymo=d=>d.slice(0,7),fd=s=>s.split('-').reverse().join('/');
const ymadd=(s,n)=>{let[y,m]=s.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=(m-1)%12+1;return y+'-'+String(m).padStart(2,'0')};
const MN=s=>{const[y,m]=s.split('-');return['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][m-1]+'/'+y};
const D0={ts:0,texts:{},view:'rank',per:'m',ym:'2026-10',amo:'2026-10',team:['Adriana','Bruna','Caroline'].map(n=>({n,att:{}})),deals:[],
 rules:{maxF:0,minT:90,gate:'Sim',start:'2026-10-01',cresc:20,mb:{Seguro:20,Marketing:20,'Aluguel de Motos':20},
 prizes:{3:'Jantar no Coco Bambu para 2 pessoas',6:'Jantar no Coco Bambu para 3 pessoas (família)',9:'Fim de semana com hospedagem',12:'Viagem de premiação (destino a definir)'},cp:{3:300,6:450,9:1200,12:6000},
 mensal:['Dia de folga','Vale-presente de delivery','Cesta de café gourmet','Vale happy hour','Caixa de chocolates','Saída mais cedo na sexta','Vale-presente de loja online','Almoço por conta da empresa','Vale cinema para 2','Vale-presente de livraria','Kit churrasco','Vale-presente de fim de ano'],
 cm:[80,100,90,100,70,0,100,120,120,100,150,150],
 cat:'Vale-presente e troféu de destaque',tes:{goal:40,prize:'Baú do Tesouro: bônus surpresa'}}};
const SV=[['Disparo em massa','📨'],['Tráfego','🎯'],['Gerenciamento','🧩'],['Gráfica','🖨️']];
function norm(s){const R=s.rules,d=D0.rules;R.mb=R.mb||{...d.mb};R.mensal=R.mensal||[...d.mensal];R.cm=R.cm||[...d.cm];R.cp=R.cp||{...d.cp};R.prizes={...d.prizes,...R.prizes};s.deals.forEach(x=>x.serv=x.serv||[]);return s}
function load(){let a=null,b=null;try{a=JSON.parse(localStorage.getItem('tg_bonus2'))}catch(e){}try{b=JSON.parse($('#seed').textContent)}catch(e){}
 if(b&&b.pres)return norm(b);const s=(a&&b)?(a.ts>=b.ts?a:b):(a||b);return norm(s||structuredClone(D0))}
let S=load(),open=null,edit=false,nw=null;
const T=(k,d)=>`<span data-t="${k}">${S.texts[k]??d}</span>`;
function save(){S.ts=Date.now();try{localStorage.setItem('tg_bonus2',JSON.stringify(S))}catch(e){}
 $('#ind').textContent='✔ Salvo';clearTimeout(save.t);save.t=setTimeout(()=>$('#ind').textContent='',1800)}
const mos=p=>p=='m'?[S.ym]:Array.from({length:+p},(_,i)=>ymadd(S.rules.start.slice(0,7),i));
const A=(p,m)=>(p.att||{})[m]||{f:0,a:0,c:0},ok=(p,m)=>{const a=A(p,m);return a.f<=S.rules.maxF&&(a.a>0?a.c/a.a*100:100)>=S.rules.minT};
function calc(per){const M=mos(per),P=S.team.map((p,i)=>{const ds=S.deals.filter(d=>d.who===p.n&&M.includes(ymo(d.d))),v=ds.filter(d=>ok(p,ymo(d.d))),cnt={};
 TIPOS.forEach(t=>cnt[t]=v.filter(d=>d.tipo===t).length);return{i,p,pts:v.length,blk:ds.length-v.length,cnt,last:v.map(d=>d.d).sort().pop()||'9999',bm:M.filter(m=>!ok(p,m))}});
 P.sort((a,b)=>b.pts-a.pts||(a.last<b.last?-1:a.last>b.last?1:0));const cat={};
 TIPOS.forEach(t=>{const mx=Math.max(0,...P.map(x=>x.cnt[t]));cat[t]={mx,who:mx?P.filter(x=>x.cnt[t]==mx).map(x=>x.p.n):[]}});
 return{P,cat,tot:P.reduce((s,x)=>s+x.pts,0)}}
function meta(){const g=1+S.rules.cresc/100,per=TIPOS.map(t=>{const n=S.deals.filter(d=>d.tipo==t).length,m=Math.ceil((S.rules.mb[t]||0)*g);return{t,n,m,p:m?Math.round(n/m*100):0}}),n=per.reduce((s,x)=>s+x.n,0),m=per.reduce((s,x)=>s+x.m,0);
 return{per,n,m,p:m?Math.round(n/m*100):0,hit:m>0&&n>=m}}
const mIdx=m=>{const[a,b]=S.rules.start.slice(0,7).split('-').map(Number),[y,z]=m.split('-').map(Number);return Math.max(0,Math.min(11,(y-a)*12+z-b))},prize=k=>k=='m'?S.rules.mensal[mIdx(S.ym)]:S.rules.prizes[k];
const inp=(p,v,t='text',x='')=>`<input type="${t}" value="${String(v).replace(/"/g,'&quot;')}" data-p="${p}" ${x}>`,
 sel=(p,v,o)=>`<select data-p="${p}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`,
 pl=n=>n+' fechamento'+(n==1?'':'s');
function vRank(){const c=calc(S.per),L=c.P[0],mt=meta(),lead=L&&L.pts>0,sm=t=>c.P.reduce((s,x)=>s+x.cnt[t],0),blk=c.P.reduce((s,x)=>s+x.blk,0);
 return `<section class="hero"><div><p class="lab">${EMP}</p><h1>${T('t1','Ranking de Fechamentos')}</h1>
 <div class="pills">${PER.map(([k,l])=>`<button class="${S.per==k?'on':''}" data-act="per" data-k="${k}">${l}</button>`).join('')}
 ${S.per=='m'?`<button class="mv" data-act="mv" data-k="-1" aria-label="Mês anterior">‹</button><b>${MN(S.ym)}</b><button class="mv" data-act="mv" data-k="1" aria-label="Próximo mês">›</button>`:''}</div>
 <p class="sub">${S.per=='m'?'Apuração do mês':'Acumulado dos '+S.per+' primeiros meses, desde '+fd(S.rules.start)}. Pontua quem mais fecha.</p></div>
 <div class="spot">${lead?`<small>👑 Líder do período</small><b>${L.p.n}</b><small>${pl(L.pts)}</small>`:'<small>🚀 Período aberto</small><b>Sem fechamentos</b><small>Seja a primeira!</small>'}</div></section>
 <div class="cats">${TIPOS.map((t,i)=>{const k=c.cat[t],n=sm(t);return `<div class="card cat ni${i}"><div class="hd"><span class="ic">${TI[t]}</span><b>${t}</b></div><div class="n">${n}</div><small>${n==1?'fechamento':'fechamentos'}</small>
 <div class="ppl">${k.mx?`<div><span>⭐ Destaque</span><b>${k.who.join(' e ')} (${k.mx})</b></div>`:'<div><span>Sem fechamentos ainda</span></div>'}</div></div>`}).join('')}
 <div class="card cat tot"><div class="hd"><span class="ic">➕</span><b>Total geral</b></div><div class="n">${c.tot}</div><small>fechamentos no período</small><div class="ppl"><div><span>${blk?'🚫 Bloqueados por faltas ou tarefas':'✅ Todos válidos'}</span><b>${blk||''}</b></div></div></div></div>
 <div class="card metaC"><b>🎯 Meta de fechamentos de clientes (+${S.rules.cresc}%)</b><small style="display:block">Acumulado do programa, em % da meta</small>
 ${mt.per.map((x,i)=>`<div class="mrow ni${i}"><span>${TI[x.t]} ${x.t}</span><div class="bar"><i style="width:${Math.min(100,x.p)}%"></i></div><b>${x.p}% <small>(${x.n} de ${x.m})</small></b></div>`).join('')}

 <div class="wrap"><table><tr><th>Nicho</th><th>Data</th><th>Colaboradora</th><th>Tipo</th><th>Cliente</th><th>Serviços (Marketing)</th><th></th></tr>
 ${ds.map(({d,i})=>`<tr class="nr ni${TIPOS.indexOf(d.tipo)}"><td><span class="nb">${TI[d.tipo]} ${d.tipo}</span></td><td>${inp(`deals.${i}.d`,d.d,'date')}</td><td>${sel(`deals.${i}.who`,d.who,S.team.map(p=>p.n))}</td><td>${sel(`deals.${i}.tipo`,d.tipo,TIPOS)}</td><td>${inp(`deals.${i}.cli`,d.cli)}</td>

 R.mensal.forEach((p,i)=>{if(+R.cm[i]>c3)w.push(`${i+1}º mês (${p}) passa o prêmio de 3 meses`)});[3,6,9,12].forEach((k,i,a)=>{if(i&&+R.cp[k]<+R.cp[a[i-1]])w.push(`O prêmio de ${k} meses é menor que o de ${a[i-1]} meses`)});
 return `<h1>${T('t3','⚙️ Configurar')}</h1><p class="sub">O que você muda aqui atualiza ranking, prêmios e regulamento.</p>

 <div class="gate" ${w.length?'style="border-color:var(--no)"':''}>${w.length?'⚠️ '+w.join('<br>⚠️ '):'✅ Todos os prêmios mensais estão abaixo do de 3 meses e a escada só sobe.'}</div>

 $('#app').innerHTML=({rank:vRank,prizes:vPrizes,tes:vTes,rules:vRules,deals:vDeals,config:vConfig}[S.view]||vRank)()+`<p class="foot">© ${EMP} Todos os direitos reservados.</p>`;

 const u=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download=pres?'Tiger_Gate_Apresentacao.html':'Tiger_Gate_Bonificacao.html';l.click()}

 if(act=='tab'){S.view=a.dataset.k;save()}else if(act=='per'){S.per=a.dataset.k;save()}else if(act=='mv'){S.ym=ymadd(S.ym,+a.dataset.k);save()}

 else if(act=='delp'){if(confirm('Excluir esta pessoa e os fechamentos dela?')){const n=S.team[open].n;S.deals=S.deals.filter(d=>d.who!==n);S.team.splice(open,1);open=null;save()}}

render();

  const btn = document.getElementById("btnSyncNotion");
  const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();

  try{
    if(btn) btn.disabled = true;
    if(status) status.innerText = "Sincronizando Notion...";

    if(!location.protocol.startsWith("http")) throw new Error("Abra pelo endereço do site (Vercel), não pelo arquivo no computador");
    const response = await fetch("/api/notion");
    const data = await response.json().catch(() => null);

    if(!response.ok || !data || !Array.isArray(data.fechamentos)){
      const det = data && (data.error || (data.erros && data.erros.map(e => e.banco+": "+e.erro).join(" | ")));
      throw new Error(det || ("HTTP " + response.status));
    }

    const nomes = S.team.map(p => p.n);
    const semMatch = new Set();

    // guarda os serviços já marcados em fechamentos vindos do Notion
    const antigos = {};
    S.deals.filter(d => d.src === "notion").forEach(d => { antigos[[d.who,d.cli,d.d].join("|")] = d.serv || []; });

    const convertidos = data.fechamentos.map(item => {
      const who = nomes.find(n => norm(n) === norm(item.funcionario)) || (item.funcionario || "");
      if(!nomes.includes(who)) semMatch.add(who || "(vazio)");
      const d = (item.data || "").slice(0,10);
      const cli = item.cliente || "";
      return {
        d, who, cli,
        tipo: item.tipo === "MKT" ? "Marketing" : (item.tipo || "Seguro"),
        serv: antigos[[who,cli,d].join("|")] || [],
        val: 0, dur: 3, src: "notion"
      };
    });

    // mantém os fechamentos lançados à mão (ex.: Aluguel de Motos) e troca só os do Notion
    S.deals = S.deals.filter(d => d.src !== "notion").concat(convertidos);
    save();
    render();

    let msg = "Sincronizado: " + convertidos.length + " fechamentos";
    if(data.erros && data.erros.length) msg += " | Falhou: " + data.erros.map(e => e.banco).join(", ");
    if(semMatch.size) msg += " | Sem colaboradora na equipe: " + [...semMatch].join(", ");
    if(status) status.innerText = msg;

  }catch(e){
    console.error(e);
    if(status) status.innerText = "Erro: " + e.message;
  }finally{
    if(btn) btn.disabled = false;
  }
}
</script>

</body></html>

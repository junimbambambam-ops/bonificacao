<script>
const $=s=>document.querySelector(s),EMP='Corporação Tiger Gate Ltd.',TIPOS=['Seguro','Marketing','Aluguel de Motos'],TI={Seguro:'🛡️',Marketing:'📣','Aluguel de Motos':'🏍️'},MED=['🥇','🥈','🥉'];
const PER=[['m','Mensal'],['3','3 meses'],['6','6 meses'],['9','9 meses'],['12','12 meses']],PI={m:'🎁',3:'🥉',6:'🥈',9:'🥇',12:'🏆'};
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),ymo=d=>d.slice(0,7),fd=s=>s.split('-').reverse().join('/');
const ymadd=(s,n)=>{let[y,m]=s.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=(m-1)%12+1;return y+'-'+String(m).padStart(2,'0')};
const MN=s=>{const[y,m]=s.split('-');return['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][m-1]+'/'+y};
const D0={ts:0,occ:[],texts:{},view:'rank',per:'m',ym:'2026-10',amo:'2026-10',team:['Adriana','Bruna','Caroline'].map(n=>({n,att:{}})),deals:[],
 rules:{maxF:0,minT:90,pf:1,pgv:2,pg:{Leve:0.5,'Média':1,Grave:2},gate:'Não',start:'2026-10-01',cresc:20,metaAno:200,metaIni:'',metaTit:'Meta do final de ano',mb:{Seguro:20,Marketing:20,'Aluguel de Motos':20},
 prizes:{3:'Jantar no Coco Bambu para 2 pessoas',6:'Jantar no Coco Bambu para 3 pessoas (família)',9:'Fim de semana com hospedagem',12:'Viagem de premiação (destino a definir)'},cp:{3:300,6:450,9:1200,12:6000},

function norm(s){const R=s.rules,d=D0.rules;s.occ=s.occ||[];R.pf=1;if(R.pgv!==2){R.pg={...d.pg};R.pgv=2}R.pg={...d.pg,...R.pg};if(R.mv!==3){R.gate='Não';R.mv=3}R.metaAno=+R.metaAno||d.metaAno;R.metaTit=R.metaTit||d.metaTit;R.mb=R.mb||{...d.mb};R.mensal=R.mensal||[...d.mensal];R.cm=R.cm||[...d.cm];R.cp=R.cp||{...d.cp};R.prizes={...d.prizes,...R.prizes};s.deals.forEach(x=>x.serv=x.serv||[]);return s}
// Garante que toda colaboradora citada num fechamento ou ocorrência exista de verdade na equipe.

function syncTeam(s){s=s||S;const have=new Set(s.team.map(p=>p.n)),ign=new Set(s.ignP||[]);let changed=false;const add=n=>{n=String(n||'').trim();if(n&&!have.has(n)&&!ign.has(n)){s.team.push({n,att:{}});have.add(n);changed=true}};
 (s.deals||[]).forEach(d=>add(d.who));(s.occ||[]).forEach(o=>add(o.who));return changed}

 if(b&&b.pres){const s=norm(b);syncTeam(s);return s}const s=norm((a&&b)?(a.ts>=b.ts?a:b):(a||b)||structuredClone(D0));syncTeam(s);return s}

 $('#ind').textContent='✔ Salvo';clearTimeout(save.t);save.t=setTimeout(()=>$('#ind').textContent='',1800)}
const mos=p=>p=='m'?[S.ym]:Array.from({length:+p},(_,i)=>ymadd(S.rules.start.slice(0,7),i));
const A=(p,m)=>(p.att||{})[m]||{f:0,a:0,c:0},ok=(p,m)=>{const a=A(p,m);return a.f<=S.rules.maxF&&(a.a>0?a.c/a.a*100:100)>=S.rules.minT};
function calc(per){const M=mos(per),P=S.team.map((p,i)=>{const ds=S.deals.filter(d=>d.who===p.n&&M.includes(ymo(d.d))),os=S.occ.filter(o=>o.who===p.n&&M.includes(ymo(o.d))),oc={};GR.forEach(g=>oc[g]=os.filter(o=>o.gr===g).length);
 const ded=GR.reduce((s,g)=>s+oc[g]*(+S.rules.pg[g]||0),0),cnt={};TIPOS.forEach(t=>cnt[t]=ds.filter(d=>d.tipo===t).length);
 return{i,p,pts:ds.length,oc,on:os.length,ded,sc:ds.length,cnt,last:ds.map(d=>d.d).sort().pop()||'9999'}});
 P.sort((a,b)=>b.pts-a.pts||(a.last<b.last?-1:a.last>b.last?1:0));const cat={};
 TIPOS.forEach(t=>{const mx=Math.max(0,...P.map(x=>x.cnt[t]));cat[t]={mx,who:mx?P.filter(x=>x.cnt[t]==mx).map(x=>x.p.n):[]}});
 return{P,cat,tot:P.reduce((s,x)=>s+x.pts,0)}}

 <div class="f"><div><label>Data</label><input type="date" value="${nw.d}" data-nw="d"></div><div><label>Colaboradora</label><select data-nw="who">${S.team.map(p=>`<option ${!nova&&p.n==nw.who?'selected':''}>${esc(p.n)}</option>`).join('')}<option value="__nova__" ${nova?'selected':''}>➕ Nova colaboradora…</option></select></div><div><label>Cliente</label><input value="${nw.cli.replace(/"/g,'&quot;')}" data-nw="cli"></div></div>
 ${nova?`<div class="f"><div><label>Nome da nova colaboradora</label><input value="${String(nw.newName||'').replace(/"/g,'&quot;')}" data-nw="newName" placeholder="Ex.: Alfredo" autofocus></div></div>`:''}

function vConfig(){const R=S.rules,n=(p,l,v)=>`<div><label>${l}</label>${inp(p,v,'number','step=any min=0')}</div>`,tx=(p,l,v)=>`<div><label>${l}</label>${inp(p,v)}</div>`,w=[],c3=+R.cp[3];
 R.mensal.forEach((p,i)=>{if(+R.cm[i]>c3)w.push(`${i+1}º mês (${p}) passa o prêmio de 3 meses`)});[3,6,9,12].forEach((k,i,a)=>{if(i&&+R.cp[k]<+R.cp[a[i-1]])w.push(`O prêmio de ${k} meses é menor que o de ${a[i-1]} meses`)});

 <div class="card" style="margin-bottom:14px"><h3>Prêmios por período (custo estimado em R$, só para você conferir)</h3>${[3,6,9,12].map(k=>`<div class="f2"><div><label>Campeã de ${k} meses</label>${inp('rules.prizes.'+k,R.prizes[k])}</div>${n('rules.cp.'+k,'Custo',R.cp[k])}</div>`).join('')}</div>
 <div class="card" style="margin-bottom:14px"><h3>Prêmios de cada mês</h3>${R.mensal.map((p,i)=>`<div class="f2"><div><label>${i+1}º mês (${MN(ymadd(R.start.slice(0,7),i))})</label>${inp('rules.mensal.'+i,p)}</div>${n('rules.cm.'+i,'Custo',R.cm[i])}</div>`).join('')}</div>
 <div class="card"><h3>Extras</h3><div class="f">${tx('rules.cat','Destaque por categoria',R.cat)}${tx('rules.tes.prize','Tesouro',R.tes.prize)}${n('rules.tes.goal','Meta do tesouro (fechamentos)',R.tes.goal)}</div></div>`}
function render(){const H=document.documentElement;H.dataset.pal=S.pal||'exec';H.dataset.theme=S.theme||'light';$('#pal').value=S.pal||'exec';
 document.body.classList.toggle('pres',!!S.pres);document.body.classList.toggle('edit',edit&&!S.pres);
 $('#nav').innerHTML=[['rank','🏆 Ranking'],['prizes','🎁 Prêmios'],['tes','🗺️ Tesouro'],['rules','📜 Regulamento'],['deals','📝 Fechamentos',1],['occ','⚠️ Ocorrências',1],['config','⚙️ Configurar',1]].filter(n=>!(S.pres&&n[2])).map(([k,l,a])=>`<button class="${S.view==k?'on':''}${a?' adm':''}" data-act="tab" data-k="${k}">${l}</button>`).join('');
 $('#app').innerHTML=({rank:vRank,prizes:vPrizes,tes:vTes,rules:vRules,deals:vDeals,occ:vOcc,config:vConfig}[S.view]||vRank)()+`<p class="foot">© ${EMP} Todos os direitos reservados.</p>`;
 const p=S.team[open];if(p){p.att=p.att||{};p.att[S.amo]=p.att[S.amo]||{f:0,a:0,c:0}}const b=p&&`team.${open}.att.${S.amo}.`;
 $('#modal').innerHTML=nw&&!S.pres?nwModal():p&&!S.pres?`<div class="md" data-act="close"><div class="card"><h3 style="margin-bottom:12px">Editar ${p.n}</h3><div class="f"><div><label>Nome</label>${inp(`team.${open}.n`,p.n)}</div><div><small>Faltas e tarefas ficam na aba ⚠️ Ocorrências.</small></div></div>
 <div class="row"><button class="btn" data-act="delp">Excluir pessoa</button><button class="btn pri" data-act="close" data-x="1">Pronto</button></div></div></div>`:'';
 document.querySelectorAll('[data-t]').forEach(e=>e.contentEditable=edit&&!S.pres)}
function setPath(path,v){const k=path.split('.');let o=S;k.slice(0,-1).forEach(x=>o=o[x]);const l=k[k.length-1],m=path.match(/^team\.(\d+)\.n$/);
 if(m){const old=o[l];S.deals.forEach(d=>{if(d.who===old)d.who=v});S.occ.forEach(d=>{if(d.who===old)d.who=v})}o[l]=typeof o[l]==='number'?(+v||0):v}
function dl(pres){save();const s=Object.assign({},S,{pres:pres?1:0,view:'rank'}),c=document.documentElement.cloneNode(true);
 c.querySelector('#seed').textContent=JSON.stringify(s).replace(/</g,'\\u003c');c.querySelector('#app').innerHTML='';c.querySelector('#modal').innerHTML='';c.querySelector('body').className='';
 const u=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download=pres?'Tiger_Gate_Apresentacao.html':'Tiger_Gate_Bonificacao.html';l.click()}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.nw){nw[t.dataset.nw]=t.value;if(t.dataset.nw=='who')render();return}if(t.id=='pal'){S.pal=t.value;save();render();return}if(t.dataset.fm){S.filM=t.value;save();render();return}if(t.dataset.npn){npName=t.value;return}const p=t.dataset.p;if(!p)return;
 setPath(p,t.tagName=='SELECT'&&/\.dur$/.test(p)?+t.value:t.value);save();render()});
document.addEventListener('focusout',e=>{const k=e.target.dataset&&e.target.dataset.t;if(k){S.texts[k]=e.target.innerHTML;save()}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,i=+a.dataset.i;
 if(S.pres&&!['tab','theme','per','mv'].includes(act))return;
 if((act=='close'||act=='nwc')&&e.target.closest('.md>div')&&!a.dataset.x)return;
 if(act=='tab'){S.view=a.dataset.k;save()}else if(act=='per'){S.per=a.dataset.k;save()}else if(act=='mv'){S.ym=ymadd(S.ym,+a.dataset.k);save()}
 else if(act=='open'){open=i;S.amo=S.per=='m'?S.ym:S.amo}else if(act=='close')open=null;
 else if(act=='addp'){S.team.push({n:'Nova pessoa',att:{}});open=S.team.length-1;save()}
 else if(act=='addp2'){const n=String(npName||'').trim();if(!n)return alert('Digite o nome da colaboradora.');
 if(S.team.some(p=>p.n===n))return alert('Essa colaboradora já existe no ranking.');
 S.team.push({n,att:{}});S.ignP=(S.ignP||[]).filter(x=>x!==n);npName='';save()}
 else if(act=='delp'){if(confirm('Excluir esta pessoa e os fechamentos dela? Ela não vai voltar sozinha numa próxima sincronização do Notion.')){const n=S.team[open].n;S.deals=S.deals.filter(d=>d.who!==n);S.occ=S.occ.filter(d=>d.who!==n);S.team.splice(open,1);S.ignP=S.ignP||[];if(!S.ignP.includes(n))S.ignP.push(n);open=null;save()}}
 else if(act=='unignp'){S.ignP=(S.ignP||[]).filter(x=>x!==a.dataset.n);save()}
 else if(act=='addd'){const t=a.dataset.t0;S.deals.push({d:t<S.rules.start?S.rules.start:t,who:(S.team[0]||{}).n||'',tipo:TIPOS.includes(S.fil)?S.fil:'Seguro',cli:'',dur:3,val:0});save()}
 else if(act=='new'){const t=new Date().toISOString().slice(0,10);nw={tipo:a.dataset.k,d:t<S.rules.start?S.rules.start:t,who:(S.team[0]||{}).n||'',cli:'',serv:[]}}
 else if(act=='nwt')nw.tipo=a.dataset.k;
 else if(act=='nwv'){const s=nw.serv,k=a.dataset.k;s.includes(k)?s.splice(s.indexOf(k),1):s.push(k)}
 else if(act=='nwc')nw=null;
 else if(act=='nwsave'){const who=nw.who==='__nova__'?String(nw.newName||'').trim():nw.who;if(!who){alert('Informe o nome da nova colaboradora.');return}
 S.deals.push({d:nw.d,who,tipo:nw.tipo,cli:nw.cli,serv:nw.serv});syncTeam(S);S.fil=nw.tipo;if(S.view!='rank')S.view='deals';nw=null;save()}
 else if(act=='sv'){const s=S.deals[i].serv,k=a.dataset.k;s.includes(k)?s.splice(s.indexOf(k),1):s.push(k);save()}
 else if(act=='fil'){S.fil=a.dataset.k;save()}
 else if(act=='newocc'){const t=new Date().toISOString().slice(0,10);S.occ.push({d:t<S.rules.start?S.rules.start:t,who:(S.team[0]||{}).n||'',tipo:'Falta',gr:'Leve',obs:''});S.view='occ';save()}
 else if(act=='delo'){S.occ.splice(i,1);save()}
 else if(act=='ofil'){S.ofil=a.dataset.k;save()}
 else if(act=='deld'){delDeal(i)}
 else if(act=='delc'){if(confirm('Remover este cliente?'))delDeal(i)}
 else if(act=='unign'){S.ign=[];save()}
 else if(act=='edit'){edit=!edit;$('#be').textContent=edit?'✏️ Editando: clique nos textos':'✏️ Modo edição'}
 else if(act=='save')save();
 else if(act=='theme'){S.theme=S.theme=='dark'?'light':'dark';save()}
 else if(act=='dl')dl(a.dataset.pres=='1');
 render()});
render();

<button id="btnSyncNotion" class="adm" onclick="sincronizarNotionFinal()" style="
position:fixed;
right:20px;
bottom:20px;
z-index:9999;
padding:12px 18px;
border-radius:12px;
border:0;
cursor:pointer;
font-weight:700;
background:#f5c400;">
🔄 Sincronizar Notion
</button>
<div id="syncStatusNotion" class="adm" style="
position:fixed;
right:20px;
bottom:70px;
z-index:9999;
background:white;
padding:8px 12px;
border-radius:8px;
font-size:13px;">
</div>

<script>
async function sincronizarNotionFinal(){
  const status = document.getElementById("syncStatusNotion");
  const btn = document.getElementById("btnSyncNotion");
  const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
  // apelidos: como o nome aparece no Notion -> nome da equipe (Carol = Caroline)
  const ALIAS = { carol: "caroline" };

  try{
    if(btn) btn.disabled = true;
    if(status) status.innerText = "Sincronizando Notion...";
    if(!location.protocol.startsWith("http")) throw new Error("Abra pelo endereço do site (Vercel), não pelo arquivo no computador");

    const response = await fetch("/api/notion", { headers: { "x-senha": encodeURIComponent(window.TG_PW || "") }, cache: "no-store" });
    if(response.status === 401){ sairPainel(); throw new Error("Senha expirada"); }
    const data = await response.json().catch(() => null);
    if(!response.ok || !data || !Array.isArray(data.fechamentos)){
      const det = data && (data.error || (data.erros && data.erros.map(e => e.banco+": "+e.erro).join(" | ")));
      throw new Error(det || ("HTTP " + response.status));
    }

    const nomes = S.team.map(p => p.n);
    const semMatch = new Set();
    const casar = nome => {
      const n = norm(String(nome||"").split(/[,;&]/)[0]);
      if(!n) return "";
      let x = nomes.find(t => norm(t) === n);
      if(x) return x;
      if(ALIAS[n]){ x = nomes.find(t => norm(t) === ALIAS[n]); if(x) return x; }
      const c = nomes.filter(t => norm(t).startsWith(n) || n.startsWith(norm(t)));
      return c.length === 1 ? c[0] : String(nome).split(/[,;&]/)[0].trim();
    };

    const ign = new Set(S.ign || []);
    const antigos = {};
    S.deals.forEach(d => { if(d.nid) antigos[d.nid] = d; });

    const ignP = new Set((S.ignP || []).map(norm));
    let semData = 0, ignorados = 0;
    const novos = data.fechamentos.filter(f => !f.id || !ign.has(f.id)).map(f => {
      const who = casar(f.funcionario);
      if(!nomes.includes(who)) semMatch.add(who || "(vazio)");
      const d = (f.data || "").slice(0,10);
      if(!d) semData++;
      const old = f.id ? antigos[f.id] : null;
      return {
        d, who, cli: f.cliente || "",
        tipo: f.tipo === "MKT" ? "Marketing" : (f.tipo || "Seguro"),
        serv: old ? (old.serv || []) : [],
        val: 0, dur: 3, nid: f.id, src: "notion"
      };
    }).filter(d => {
      if(ignP.has(norm(d.who))){ ignorados++; return false; } // colaboradora excluída manualmente: não volta sozinha
      return true;
    });

    // mantém tudo que você lançou à mão; troca só o que veio do Notion
    S.deals = S.deals.filter(d => !d.nid && d.src !== "notion").concat(novos);
    syncTeam(S); // garante que toda colaboradora que veio do Notion também exista na equipe e pontue
    save();
    render();

    let msg = "Sincronizado: " + novos.length + " fechamentos do Notion";
    if(data.erros && data.erros.length) msg += " | Falhou: " + data.erros.map(e => e.banco).join(", ");
    if(semMatch.size) msg += " | Nome sem correspondência na equipe: " + [...semMatch].join(", ");
    if(semData) msg += " | " + semData + " sem data (não entram no ranking)";
    if(ignorados) msg += " | " + ignorados + " de colaboradora(s) excluída(s) não foram trazidos de volta";
    if(status) status.innerText = msg;
  }catch(e){
    console.error(e);
    if(status) status.innerText = "Erro: " + e.message;
  }finally{
    if(btn) btn.disabled = false;
  }
}
// ---- tela de senha ----
async function gateCheck(pw){
  const r = await fetch("/api/login", { headers: { "x-senha": encodeURIComponent(pw) }, cache: "no-store" });
  if(r.ok) return true;
  if(r.status === 401) return false;
  const j = await r.json().catch(() => ({}));
  throw new Error(j.error || ("HTTP " + r.status));
}
async function gateEnter(){
  const pw = document.getElementById("gpw").value, msg = document.getElementById("gmsg");
  if(!pw) return;
  msg.textContent = "Verificando...";
  try{
    if(await gateCheck(pw)){
      window.TG_PW = pw;
      (document.getElementById("gkeep").checked ? localStorage : sessionStorage).setItem("tg_pw", pw);
      document.getElementById("gate").style.display = "none";
      document.getElementById("gpw").value = ""; msg.textContent = "";
    }else{ msg.textContent = "Senha incorreta"; document.getElementById("gpw").select(); }
  }catch(e){ msg.textContent = e.message; }
}
function sairPainel(){
  try{ sessionStorage.removeItem("tg_pw"); localStorage.removeItem("tg_pw"); }catch(e){}
  window.TG_PW = ""; location.reload();
}
(async function(){
  const g = document.getElementById("gate");
  if(!location.protocol.startsWith("http") || S.pres){ g.style.display = "none"; return; } // arquivo local ou apresentação exportada
  document.getElementById("gpw").addEventListener("keydown", e => { if(e.key === "Enter") gateEnter(); });
  let sv = ""; try{ sv = sessionStorage.getItem("tg_pw") || localStorage.getItem("tg_pw") || ""; }catch(e){}
  if(sv){ try{ if(await gateCheck(sv)){ window.TG_PW = sv; g.style.display = "none"; return; } }catch(e){} }
})();
</script>
